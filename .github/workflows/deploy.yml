name: Validate British Scholars

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: british-scholars-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s robots.txt
          test -s sitemap.xml
          grep -q '<title>' index.html
          grep -q 'https://britishscholars.ae/' sitemap.xml
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"
