name: Validate British Scholars

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: british-scholars-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s robots.txt
          test -s sitemap.xml
          test -s site-events.js
          test -s social-preview.png
          test -s british-scholars-logo.svg
          test -s contact-british-scholars.html
          test -s resources.html
          test ! -e analytics.js
          grep -q '<title>' index.html
          grep -q 'rel="canonical" href="https://britishscholars.ae/"' index.html
          grep -q 'https://britishscholars.ae/' sitemap.xml
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"
          for page in *.html; do
            grep -q 'site-events.js' "$page"
            grep -q 'name="description"' "$page"
            grep -q 'rel="canonical"' "$page"
            grep -q 'property="og:image"' "$page"
            grep -q 'name="twitter:card"' "$page"
          done
          node tools/validate-seo.mjs
